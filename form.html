<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>from</title>
</head>

<body>
    <div>
        <h1>Registration Page</h1>
        <h3>Please Fill the Below Details</h3>
    </div>

    <div>
        <form>

            <div>
                <label for="nameId">NAME<span style="color: red;">*</span> :</label>
                <input id="nameId" type="text" required placeholder="Enter your Name" name="name">
            </div>

            <br>

            <div><label for="emailID">Email<span style="color: red;">*</span> :</label>
                <input id="emailID" type="email" required placeholder="Enter your emil ID" name="email">
            </div>

            <br>

            <div>
                <label for="phoneId">Phone NO<span style="color: red;">*</span> :</label>
                <input id="phoneId" type="text" required placeholder="Enter your Phone Number" name="phoneNo">
            </div>

            <br>

            <div>
                <label>Gender<span style="color: red;">*</span> :</label>

                <label for="maleId">Male</label>
                <input type="radio" id="maleId" required value="male">

                <label for="femaleId">Female</label>
                <input type="radio" id="femaleId" required value="female">

            </div>

            <br>

            <div>
                <input type="submit">
            </div>

        </form>
    </div>
</body>

</html>
