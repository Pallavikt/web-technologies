<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow</title>
</head>

<body>

    <div>
        <form>
            <h2>Form for Booking Movie Tickets</h2>

            <div><label for="nameId">Name:</label>
                <input id="nameId" type="text" placeholder="Enter Your Name" name="name" required>
            </div>
            <br>

            <div><label for="phoneId">Phone No:</label>
                <input id="phoneId" type="text" placeholder="Enter your Phone Number" name="Phone" required>
            </div>
            <br>

            <div> <label for="emailID">Email ID:</label>
                <input id="emailID" type="email" placeholder="Enter Your Email Address" name="email" required>
            </div>
            <br>

            <div><label for="movieId">Movie:</label>
                <input id="movieId" type="text" placeholder="Enter the Movie Name" name="Movie" required>
            </div>
            <br>

            <div>
                <input type="submit">
            </div>
    </div>
    </form>
</body>

</html>
